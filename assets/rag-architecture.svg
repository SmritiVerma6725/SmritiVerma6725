<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="100%">
  <defs>
    <linearGradient id="ragCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="flowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .stage-box {
      fill: #111827;
      stroke: #334155;
      stroke-width: 1.2;
      rx: 8;
    }
    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 0.5px;
    }
    .stage-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .arrow-line {
      stroke: #475569;
      stroke-width: 1.5;
      stroke-dasharray: 3,3;
    }
    .arrow-head {
      fill: #475569;
    }
  </style>

  <!-- Canvas Background -->
  <rect x="2" y="2" width="846" height="141" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Stage 1: Document Ingestion -->
  <g transform="translate(15, 25)">
    <rect width="115" height="70" class="stage-box" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="57" y="32" text-anchor="middle" class="stage-title">PDF Ingestion</text>
    <text x="57" y="48" text-anchor="middle" class="stage-sub">Domain Docs</text>
    <text x="57" y="60" text-anchor="middle" class="stage-sub" fill="#38BDF8">Input Layer</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="130" y1="60" x2="155" y2="60" class="arrow-line" />
  <polygon points="155,57 160,60 155,63" class="arrow-head"/>

  <!-- Stage 2: Chunking & Embeddings -->
  <g transform="translate(160, 25)">
    <rect width="125" height="70" class="stage-box" stroke="#60A5FA" stroke-opacity="0.6"/>
    <text x="62" y="32" text-anchor="middle" class="stage-title">Chunk &amp; Embed</text>
    <text x="62" y="48" text-anchor="middle" class="stage-sub">Hugging Face</text>
    <text x="62" y="60" text-anchor="middle" class="stage-sub" fill="#60A5FA">Embedding Model</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="285" y1="60" x2="310" y2="60" class="arrow-line" />
  <polygon points="310,57 315,60 310,63" class="arrow-head"/>

  <!-- Stage 3: Vector Store -->
  <g transform="translate(315, 25)">
    <rect width="115" height="70" class="stage-box" stroke="#818CF8" stroke-opacity="0.6"/>
    <text x="57" y="32" text-anchor="middle" class="stage-title">ChromaDB</text>
    <text x="57" y="48" text-anchor="middle" class="stage-sub">Vector Index</text>
    <text x="57" y="60" text-anchor="middle" class="stage-sub" fill="#818CF8">Persistent Store</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="430" y1="60" x2="455" y2="60" class="arrow-line" />
  <polygon points="455,57 460,60 455,63" class="arrow-head"/>

  <!-- Stage 4: Similarity Retrieval -->
  <g transform="translate(455, 25)">
    <rect width="115" height="70" class="stage-box" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="57" y="32" text-anchor="middle" class="stage-title">RetrievalQA</text>
    <text x="57" y="48" text-anchor="middle" class="stage-sub">LangChain Chain</text>
    <text x="57" y="60" text-anchor="middle" class="stage-sub" fill="#A78BFA">Similarity Search</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="570" y1="60" x2="595" y2="60" class="arrow-line" />
  <polygon points="595,57 600,60 595,63" class="arrow-head"/>

  <!-- Stage 5: Inference Engine -->
  <g transform="translate(595, 25)">
    <rect width="115" height="70" class="stage-box" stroke="#C084FC" stroke-opacity="0.6"/>
    <text x="57" y="32" text-anchor="middle" class="stage-title">Groq / LLaMA-3</text>
    <text x="57" y="48" text-anchor="middle" class="stage-sub">LLM Inference</text>
    <text x="57" y="60" text-anchor="middle" class="stage-sub" fill="#C084FC">Prompt Synthesis</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="710" y1="60" x2="735" y2="60" class="arrow-line" />
  <polygon points="735,57 740,60 735,63" class="arrow-head"/>

  <!-- Stage 6: Grounded Output -->
  <g transform="translate(735, 25)">
    <rect width="100" height="70" class="stage-box" stroke="#E879F9" stroke-opacity="0.6"/>
    <text x="50" y="32" text-anchor="middle" class="stage-title">Gradio / CLI</text>
    <text x="50" y="48" text-anchor="middle" class="stage-sub">Contextual</text>
    <text x="50" y="60" text-anchor="middle" class="stage-sub" fill="#E879F9">User Dialogue</text>
  </g>

  <!-- Animated Data Packet Pulse traveling across pipeline -->
  <circle cx="20" cy="60" r="3.5" fill="#38BDF8" filter="url(#nodeGlow)">
    <animate attributeName="cx" values="20;140;290;440;580;720;830" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#38BDF8;#60A5FA;#818CF8;#A78BFA;#C084FC;#E879F9;#38BDF8" dur="4.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;1;1;1;0" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom Annotation Bar -->
  <text x="425" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" letter-spacing="1px">
    RAG DATAFLOW &middot; RETRIEVALQA CHAIN &middot; VECTOR STORE EMBEDDING PIPELINE
  </text>
</svg>
