<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <style>
    .flow-node {
      fill: #090D16;
      stroke: #334155;
      stroke-width: 1.2;
      rx: 8;
    }
    .flow-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 800;
      fill: #38BDF8;
    }
    .flow-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #F1F5F9;
      letter-spacing: 0.3px;
    }
    .flow-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: 500;
      fill: #94A3B8;
    }
    .conn-arrow {
      stroke: #475569;
      stroke-width: 1.5;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="86" rx="10" fill="#090D16" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Step 1: Data & Preprocessing -->
  <g transform="translate(15, 15)">
    <rect width="145" height="60" class="flow-node" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="12" y="24" class="flow-num">01</text>
    <text x="32" y="24" class="flow-title">Data Ingestion</text>
    <text x="12" y="44" class="flow-desc">Scraping &middot; Parsing &middot; Prep</text>
  </g>

  <line x1="160" y1="45" x2="180" y2="45" class="conn-arrow" stroke-dasharray="2,2"/>
  <polygon points="180,42 185,45 180,48" fill="#475569"/>

  <!-- Step 2: Model & Vision -->
  <g transform="translate(185, 15)">
    <rect width="145" height="60" class="flow-node" stroke="#60A5FA" stroke-opacity="0.6"/>
    <text x="12" y="24" class="flow-num" fill="#60A5FA">02</text>
    <text x="32" y="24" class="flow-title">Model Arch</text>
    <text x="12" y="44" class="flow-desc">YOLO &middot; MediaPipe &middot; CV</text>
  </g>

  <line x1="330" y1="45" x2="350" y2="45" class="conn-arrow" stroke-dasharray="2,2"/>
  <polygon points="350,42 355,45 350,48" fill="#475569"/>

  <!-- Step 3: Retrieval & LLM -->
  <g transform="translate(350, 15)">
    <rect width="150" height="60" class="flow-node" stroke="#818CF8" stroke-opacity="0.6"/>
    <text x="12" y="24" class="flow-num" fill="#818CF8">03</text>
    <text x="32" y="24" class="flow-title">RAG &amp; Vector</text>
    <text x="12" y="44" class="flow-desc">ChromaDB &middot; LangChain &middot; LLM</text>
  </g>

  <line x1="500" y1="45" x2="520" y2="45" class="conn-arrow" stroke-dasharray="2,2"/>
  <polygon points="520,42 525,45 520,48" fill="#475569"/>

  <!-- Step 4: System & Automation -->
  <g transform="translate(520, 15)">
    <rect width="145" height="60" class="flow-node" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="12" y="24" class="flow-num" fill="#A78BFA">04</text>
    <text x="32" y="24" class="flow-title">Automation</text>
    <text x="12" y="44" class="flow-desc">CI/CD &middot; Policy &middot; Tarballs</text>
  </g>

  <line x1="665" y1="45" x2="685" y2="45" class="conn-arrow" stroke-dasharray="2,2"/>
  <polygon points="685,42 690,45 685,48" fill="#475569"/>

  <!-- Step 5: Product & Deployment -->
  <g transform="translate(685, 15)">
    <rect width="150" height="60" class="flow-node" stroke="#C084FC" stroke-opacity="0.6"/>
    <text x="12" y="24" class="flow-num" fill="#C084FC">05</text>
    <text x="32" y="24" class="flow-title">Deployment</text>
    <text x="12" y="44" class="flow-desc">Gradio &middot; Docker &middot; Web UI</text>
  </g>
</svg>
