<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 16" width="100%" height="16">
  <defs>
    <linearGradient id="divGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left fading line -->
  <line x1="50" y1="8" x2="410" y2="8" stroke="url(#divGradLeft)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Center tech accent -->
  <polygon points="425,3 430,8 425,13 420,8" fill="#818CF8" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="414" cy="8" r="1.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="436" cy="8" r="1.5" fill="#C084FC" opacity="0.7"/>

  <!-- Right fading line -->
  <line x1="440" y1="8" x2="800" y2="8" stroke="url(#divGradRight)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
