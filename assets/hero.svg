<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 3px;
      fill: #FFFFFF;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #38BDF8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    .node {
      fill: #38BDF8;
      transition: all 0.5s ease;
    }
    .node-purple {
      fill: #C084FC;
    }
    .grid-line {
      stroke: #1E293B;
      stroke-width: 1;
      stroke-opacity: 0.4;
    }
    .net-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 4,4;
    }
    .pulse-line {
      stroke: url(#primaryGlow);
      stroke-width: 1.5;
      stroke-linecap: round;
    }
  </style>

  <!-- Card Container -->
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#bgGradient)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Background Grid -->
  <line x1="40" y1="0" x2="40" y2="220" class="grid-line" />
  <line x1="810" y1="0" x2="810" y2="220" class="grid-line" />
  <line x1="0" y1="40" x2="850" y2="40" class="grid-line" />
  <line x1="0" y1="180" x2="850" y2="180" class="grid-line" />

  <!-- Neural Net Visual Nodes (Left Accent) -->
  <g opacity="0.75">
    <!-- Lines -->
    <line x1="60" y1="110" x2="110" y2="65" class="net-line" />
    <line x1="60" y1="110" x2="110" y2="155" class="net-line" />
    <line x1="110" y1="65" x2="160" y2="110" class="net-line" />
    <line x1="110" y1="155" x2="160" y2="110" class="net-line" />
    <line x1="110" y1="65" x2="110" y2="155" class="net-line" />

    <!-- Nodes -->
    <circle cx="60" cy="110" r="4" class="node" />
    <circle cx="110" cy="65" r="3.5" class="node-purple" />
    <circle cx="110" cy="155" r="3.5" class="node" />
    <circle cx="160" cy="110" r="4.5" class="node-purple" />

    <!-- Animated Data Pulses along Network -->
    <circle cx="60" cy="110" r="3" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="cx" values="60;110;160;110;60" dur="6s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;65;110;155;110" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.8;1;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Neural Net Visual Nodes (Right Accent) -->
  <g opacity="0.75">
    <line x1="690" y1="110" x2="740" y2="65" class="net-line" />
    <line x1="690" y1="110" x2="740" y2="155" class="net-line" />
    <line x1="740" y1="65" x2="790" y2="110" class="net-line" />
    <line x1="740" y1="155" x2="790" y2="110" class="net-line" />
    <line x1="740" y1="65" x2="740" y2="155" class="net-line" />

    <circle cx="690" cy="110" r="4" class="node-purple" />
    <circle cx="740" cy="65" r="3.5" class="node" />
    <circle cx="740" cy="155" r="3.5" class="node-purple" />
    <circle cx="790" cy="110" r="4.5" class="node" />

    <circle cx="790" cy="110" r="3" fill="#C084FC" filter="url(#glow)">
      <animate attributeName="cx" values="790;740;690;740;790" dur="7s" repeatCount="indefinite" />
      <animate attributeName="cy" values="110;155;110;65;110" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.8;1;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Content Badge -->
  <rect x="235" y="32" width="380" height="26" rx="13" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
  <circle cx="250" cy="45" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="262" y="49" class="subtitle-text">AI / ML ENGINEER &middot; RAG &middot; COMPUTER VISION</text>

  <!-- Main Name Header -->
  <text x="425" y="105" text-anchor="middle" class="title-text">SMRITI VERMA</text>

  <!-- Gradient Underline Bar -->
  <rect x="365" y="120" width="120" height="3" rx="1.5" fill="url(#primaryGlow)"/>

  <!-- Subtitle Tagline -->
  <text x="425" y="152" text-anchor="middle" class="tagline-text">
    Building Intelligent Systems &middot; Generative AI &middot; Deep Learning Pipelines
  </text>
  <text x="425" y="174" text-anchor="middle" class="tagline-text" fill="#64748B">
    Automated Workflows &middot; Vector Intelligence &middot; Computer Vision Architectures
  </text>

  <!-- Corner Tech Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 834 30 L 834 16 L 820 16" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 16 190 L 16 204 L 30 204" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 834 190 L 834 204 L 820 204" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.6"/>
</svg>
